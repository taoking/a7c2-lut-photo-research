name: Offline validation
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m macfl23 setup
      - run: python -B -m macfl23 check
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s .upstream/a7c2_fl23_preview/tests -v
      - run: python -m pip install -r requirements-lut.txt -r requirements-firmware.txt
      - run: python -B -m unittest discover -s research/tests -v
